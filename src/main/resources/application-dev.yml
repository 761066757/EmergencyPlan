# Spring Boot 配置
spring:
  application:
    name: emergency-plan
  # 数据库配置：改用 HikariCP（Spring Boot 默认，无需额外引入依赖）
  # SQL 初始化：启动时自动创建 Flowable schema
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  datasource:
    type: com.zaxxer.hikari.HikariDataSource  # 显式指定 HikariCP
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/emergency_plan?currentSchema=public
    username: postgres
    password: root
    # HikariCP 核心配置（按需调整，默认值已满足大部分场景）
    hikari:
      minimum-idle: 5              # 最小空闲连接数（对应 Druid 的 min-idle）
      maximum-pool-size: 15        # 最大连接数（对应 Druid 的 max-active）
      idle-timeout: 300000         # 连接空闲超时（5分钟，对应 Druid 的 min-evictable-idle-time-millis）
      connection-timeout: 60000    # 连接获取超时（1分钟，对应 Druid 的 max-wait）
      validation-timeout: 5000     # 连接验证超时
      connection-test-query: SELECT 1  # 连接验证SQL
      data-source-properties:
        searchPath: public,flowable    # 设置模式搜索路径

# Flowable 配置：恢复 database-schema，HikariCP 完美支持 setSchema() + 保留所有模块 + 表前缀隔离
flowable:
  database-schema-update: create # 首次部署建表，建成功后改为false
  database-schema: flowable  # 指定 Flowable 表所在的模式
  # 禁用所有非核心模块
  idm:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false
  app:
    enabled: false
  # 异步执行器（Async Executor），它利用数据库行锁（或表锁）来确保定时任务和异步任务在主备或多活环境下只被一个节点执行，不会重复触发。
  async-executor-activate: false
  # 开启自动部署
  check-process-definitions: true
  # 配置流程定义文件路径（只扫描 business/ 目录下的 BPMN 文件）
  process-definition-location-prefix: classpath*:/processes/business/

# grpc 配置
grpc:
  server:
    port: 1633  # grpc服务端监听端口
    address: 0.0.0.0  #监听所有网络接口（本地 + 外部）
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 1m
    max-inbound-message-size: 52428800
  client:
    GLOBAL:
      negotiationType: plaintext
      max-inbound-message-size: 20971520
      enableKeepAlive: true
      keepAliveWithoutCalls: true
# Spring Boot 配置
spring:
  application:
    name: iscs-ep
  # SQL 初始化：启动时自动创建 Flowable schema
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  # 数据库配置
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/iscs?currentSchema=public
    username: postgres
    password: root
    # 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 300000
      connection-timeout: 60000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      data-source-properties:
        searchPath: public,flowable

# flowable 配置
flowable:
  database-schema-update: false # deploy 生产环境初次启动设置为create，服务启动成功后更改为false！！！
  database-schema: flowable
  # 禁用所有非核心模块
  idm:
    enabled: false
  dmn:
    enabled: false
  cmmn:
    enabled: false
  app:
    enabled: false
  # 关闭异步执行
  async-executor-activate: false
  # 开启自动部署
  check-process-definitions: true
  # 流程文件定义路径
  process-definition-location-prefix: classpath*:/processes/business/

# grpc 配置
grpc:
  server:
    port: 1633
    address: 0.0.0.0
    permit-keep-alive-without-calls: true
    permit-keep-alive-time: 1m
    max-inbound-message-size: 52428800
  client:
    GLOBAL:
      negotiationType: plaintext
      max-inbound-message-size: 20971520
      enableKeepAlive: true
      keepAliveWithoutCalls: true